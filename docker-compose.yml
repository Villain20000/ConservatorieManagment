services:
  db:
    image: postgres:17-alpine
    container_name: musicos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: musicos
      POSTGRES_PASSWORD: musicos
      POSTGRES_DB: musicos
    ports:
      - "5432:5432"
    volumes:
      - musicos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musicos -d musicos"]
      interval: 5s
      timeout: 3s
      retries: 20

  mail:
    image: axllent/mailpit:latest
    container_name: musicos-mail
    restart: unless-stopped
    profiles: ["mail"]
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  musicos_pgdata:
